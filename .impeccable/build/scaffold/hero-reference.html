<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: couture-curtain.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#091821}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:853px">
  <figure class="r-hero-floral region plate" data-region="hero-floral"><img src="../../../assets/plates/hero-floral.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-hero-silk region texture" data-region="hero-silk" style="background-image:url('../../../assets/plates/hero-silk.png');background-repeat:repeat"></div>
  <div class="r-xv-label region text" data-region="xv-label"><!-- small widely tracked MIS XV --><p style="font-size:var(--r-xv-label-font);line-height:1.05;margin:0">xv-label</p></div>
  <div class="r-hero-name region text" data-region="hero-name"><!-- large high-contrast serif Karen Paola --><p style="font-size:var(--r-hero-name-font);font-family:var(--r-hero-name-family),sans-serif;font-weight:var(--r-hero-name-weight);line-height:1.05;margin:0">hero-name</p></div>
  <div class="r-hero-surname region text" data-region="hero-surname"><!-- tracked serif HERNANDEZ AVILA --><p style="line-height:1.05;margin:0">hero-surname</p></div>
  <div class="r-hero-date region text" data-region="hero-date"><!-- tracked sans SÁBADO 10 DE OCTUBRE --><p style="font-size:var(--r-hero-date-font);line-height:1.05;margin:0">hero-date</p></div>
  <div class="r-open-control region control" data-region="open-control"><!-- outlined rounded opening button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop open-control); a control need not have button chrome --></div>
  <figure class="r-lower-silk region plate" data-region="lower-silk"><img src="../../../assets/plates/lower-silk.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-intro-heading region text" data-region="intro-heading"><!-- centered serif blessing heading --><p style="font-size:var(--r-intro-heading-font);line-height:1.05;margin:0">intro-heading</p></div>
  <div class="r-intro-copy region text" data-region="intro-copy"><!-- centered sans invitation sentence --><p style="font-size:var(--r-intro-copy-font);line-height:1.05;margin:0">intro-copy</p></div>
  <div class="r-parents region text" data-region="parents"><!-- parents label and names --><p style="line-height:1.05;margin:0">parents</p></div>
  <div class="r-godparents region text" data-region="godparents"><!-- godparents label and names --><p style="line-height:1.05;margin:0">godparents</p></div>
  <figure class="r-intro-floral region plate" data-region="intro-floral"><img src="../../../assets/plates/intro-floral.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-intro-silk region texture" data-region="intro-silk" style="background-image:url('../../../assets/plates/intro-silk.png');background-repeat:repeat"></div>
</main>
</body>
</html>
